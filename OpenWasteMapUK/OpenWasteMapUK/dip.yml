version: '6.1'

compose:
  files:
    - docker-compose.yml

interaction:
  sh:
    description: Open a shell within a container
    service: runner
    command: /bin/sh
  
  start:
    description: Run Aspnet.core
    service: runner
    command: dotnet run -v n --launch-profile "OpenWasteMapUK"
  
provision:
  - dip compose down --volumes
  - dip compose up
